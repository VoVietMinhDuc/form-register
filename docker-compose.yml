services:
  mysql:
    image: mysql:8.0
    container_name: rise-space-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 27112025
      MYSQL_DATABASE: risespace
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - default

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: rise-space-frontend:latest
    container_name: rise-space-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://root:27112025@mysql:3306/risespace"
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
    depends_on:
      - mysql
    networks:
      - default

volumes:
  mysql_data:

networks:
  default:
    driver: bridge
